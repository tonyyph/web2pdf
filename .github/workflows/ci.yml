name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # No `version:` here - package.json's `packageManager` field is the single
      # source of truth; specifying both fails the action with a version mismatch.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build (Chrome)
        run: pnpm build

      - name: Build (Edge)
        run: pnpm build:edge

      - name: Package
        run: pnpm zip && pnpm zip:edge

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: web2pdf-packages
          # WXT writes to `.output`, a hidden directory, which upload-artifact
          # v4 skips unless hidden files are explicitly included.
          include-hidden-files: true
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14
