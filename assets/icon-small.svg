<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!--
    Small-size variant for the 16px and 32px PNGs.

    The full artwork carries a browser window, a document, text lines and an
    arrow. That resolves beautifully at 128 and holds at 48, but by 32 the two
    stacked elements merge into a smudge and at 16 nothing is readable. This
    keeps the half of the mark that still reads at toolbar size - the output
    document with its folded corner and orange lines - on the same tile.

    Colours are the supplied palette: #F97316 primary, #EA580C strong accent.
  -->
  <defs>
    <linearGradient id="w2pSmBg" x1="10" y1="4" x2="118" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F97316" />
      <stop offset="1" stop-color="#EA580C" />
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="30" fill="url(#w2pSmBg)" />

  <!-- Document with the folded top-right corner, matching the source artwork. -->
  <path d="M28 30a8 8 0 0 1 8-8h40l24 24v52a8 8 0 0 1-8 8H36a8 8 0 0 1-8-8Z" fill="#FFFFFF" />
  <path d="M76 22v16a8 8 0 0 0 8 8h16Z" fill="#FED7AA" />

  <rect x="42" y="62" width="48" height="10" rx="5" fill="#F97316" />
  <rect x="42" y="80" width="48" height="10" rx="5" fill="#F97316" />
  <rect x="42" y="98" width="30" height="10" rx="5" fill="#FDBA74" />
</svg>
